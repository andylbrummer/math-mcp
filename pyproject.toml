[project]
name = "math-physics-ml-mcp"
version = "0.1.0"
description = "GPU-accelerated MCP system for computational mathematics, physics simulations, and machine learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nvidia-cublas-cu12>=12.8.4.1",
    "nvidia-cuda-nvrtc-cu12>=12.8.93",
    "nvidia-cuda-runtime-cu12>=12.8.90",
    "nvidia-cufft-cu12>=11.3.3.83",
    "nvidia-curand-cu12>=10.3.9.90",
    "nvidia-cusolver-cu12>=11.7.3.90",
    "nvidia-cusparse-cu12>=12.5.8.93",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]

[project.optional-dependencies]
gpu = [
    "cupy-cuda12x>=13.6.0",
]

[tool.uv.workspace]
members = [
    "shared/mcp-common",
    "shared/compute-core",
    "servers/math-mcp",
    "servers/quantum-mcp",
    "servers/molecular-mcp",
    "servers/neural-mcp",
    "servers/llm-mcp"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "DTZ", "T10", "EM", "ISC", "ICN", "G", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["TRY003", "PLR0913", "PLR2004"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "cupy",
    "cupy.*",
    "sympy",
    "sympy.*",
    "scipy",
    "scipy.*",
    "kdl",
    "kdl.*",
    "mcp_common",
    "mcp_common.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["shared", "servers"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "gpu: tests requiring CUDA GPU",
    "slow: slow running tests",
    "integration: integration tests across MCPs",
    "benchmark: performance benchmark tests"
]
asyncio_mode = "auto"
