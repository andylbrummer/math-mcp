[project]
name = "scicomp-llm-mcp"
version = "0.1.5"
description = "MCP server for LLM training, fine-tuning, and experimentation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Andy Brummer", email = "andy@example.com" }
]
keywords = ["mcp", "llm", "language-model", "gpt", "mamba", "training", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "scicomp-mcp-common>=0.1.0",
    "scicomp-compute-core>=0.1.0",
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "tiktoken>=0.5.0",
    "sentencepiece>=0.1.99",
    "datasets>=2.14.0",
    "transformers>=4.35.0",
]

[project.scripts]
scicomp-llm-mcp = "llm_mcp.server:main"

[project.urls]
Homepage = "https://github.com/andylbrummer/math-mcp"
Documentation = "https://andylbrummer.github.io/math-mcp/api/llm-mcp"
Repository = "https://github.com/andylbrummer/math-mcp"

[tool.uv.sources]
scicomp-mcp-common = { workspace = true }
scicomp-compute-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_mcp"]
